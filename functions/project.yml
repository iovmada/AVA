packages:
  - name: menu
    functions:
      - name: editor
        runtime: nodejs:22
        web: raw
        environment:
          AVA_MENU_REVIEW_MODE: "${AVA_MENU_REVIEW_MODE}"
      - name: propose
        runtime: nodejs:22
        web: raw
        limits:
          timeout: 60000
          memory: 128
        environment:
          AVA_MENU_SUBMIT_CODE: "${AVA_MENU_SUBMIT_CODE}"
          AVA_MENU_ORIGIN: "${AVA_MENU_ORIGIN}"
          AVA_MENU_REVIEW_MODE: "${AVA_MENU_REVIEW_MODE}"
          AVA_GITHUB_APP_ID: "${AVA_GITHUB_APP_ID}"
          AVA_GITHUB_INSTALLATION_ID: "${AVA_GITHUB_INSTALLATION_ID}"
          AVA_GITHUB_PRIVATE_KEY: "${AVA_GITHUB_PRIVATE_KEY}"
